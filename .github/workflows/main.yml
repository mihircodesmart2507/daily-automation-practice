name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create file and commit
        run: |
          echo "Daily update: $(date)" > daily.txt
          git config user.name "mihircodesmart2507"
          git config user.email "mihircodesmart2507@users.noreply.github.com"
          git add daily.txt
          git commit -m "Automated daily commit"
          git push
