name: Daily Contribution

on:
  schedule:
    - cron: '0 0 * * 1-5'   # Monday to Friday only!
  workflow_dispatch:

jobs:
  make-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date > log.txt
          git add log.txt
          git commit -m "Daily automated commit" || exit 0
          git push
